<html lang="ar" dir="rtl">
<head>

  <style>
    :root {
      --bg: #0B0F19;
      --surface: #131B2E;
      --card: #19233A;
      --border: #263554;
      --primary: #38BDF8;
      --accent: #10B981;
      --gold: #F59E0B;
      --text: #F8FAFC;
      --muted: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .hero {
      background: radial-gradient(circle at top, #1E293B 0%, #0B0F19 75%);
      border-bottom: 1px solid var(--border);
      padding: 48px 20px 36px;
      text-align: center;
    }
    .hero-badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.15);
      color: #34D399;
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .hero h1 {
      font-size: clamp(1.7rem, 3.5vw, 2.6rem);
      font-weight: 900;
      margin-bottom: 10px;
    }
    .hero p {
      color: var(--muted);
      max-width: 760px;
      margin: 0 auto 24px;
      font-size: 1rem;
    }
    .controls {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .search-input, .filter-select {
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
    }
    .search-input { min-width: 320px; flex: 1; max-width: 480px; }
    .container {
      max-width: 1260px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .rank-badge {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.8rem;
      color: var(--primary);
    }
    .tier-badge {
      font-size: 0.76rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.16);
      color: #FBBF24;
    }
    .store-title {
      font-size: 1.2rem;
      font-weight: 900;
    }
    .identity-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
      background: var(--surface);
      padding: 5px 12px;
      border-radius: 8px;
      width: fit-content;
    }
    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .meta-list {
      font-size: 0.86rem;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card-actions {
      margin-top: auto;
      display: flex;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .btn {
      flex: 1;
      text-align: center;
      padding: 10px 12px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.88rem;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn-demo {
      background: linear-gradient(135deg, #0EA5E9, #10B981);
      color: #fff;
    }
    .btn-map {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      flex: 0.45;
    }
  </style>
</head>

    function renderStores() {
      const q = document.getElementById('searchBox').value.trim().toLowerCase();
      const tier = document.getElementById('tierFilter').value;
      const iden = document.getElementById('identityFilter').value;

      const filtered = STORES.filter(s => {
        if (tier && !s.tier.includes(tier)) return false;
        if (iden && s.identityId !== iden) return false;
        if (q && !(s.title.toLowerCase().includes(q) || s.phone.includes(q) || s.address.toLowerCase().includes(q) || s.specialty.toLowerCase().includes(q))) return false;
        return true;
      });

      document.getElementById('countLabel').textContent = 'يعرض الآن: ' + filtered.length + ' موقع تجريبي جاهز للمعاينة';

      document.getElementById('gridContainer').innerHTML = filtered.map(s => `
        <div class="card">
          <div class="card-top">
            <span class="rank-badge">#${s.rank}</span>
            <span class="tier-badge">${s.tier.split(' - ')[0]}</span>
          </div>
          <div class="store-title">${s.title}</div>
          <div class="identity-pill">
            <span class="color-dot" style="background:${s.primaryColor}"></span>
            <span>${s.identity}</span>
          </div>
          <div class="meta-list">
            <div>🏷️ <strong>الاختصاص:</strong> ${s.specialty}</div>
            <div>📞 <strong>الهاتف:</strong> <span dir="ltr">${s.phone || 'عبر الصفحة'}</span></div>
            <div>📍 <strong>العنوان:</strong> ${s.address}</div>
          </div>
          <div class="card-actions">
            <a href="${s.demoUrl}" target="_blank" class="btn btn-demo">🌐 فتح الموقع التجريبي</a>
            ${s.mapUrl ? `<a href="${s.mapUrl}" target="_blank" class="btn btn-map">📍 الخريطة</a>` : ''}
          </div>
        </div>
      `).join('');
    }
    renderStores();
  </script>
